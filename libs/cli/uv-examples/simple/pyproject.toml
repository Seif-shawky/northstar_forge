[project]
name = "northstar-forge"
version = "0.1.0"
description = "Northstar Forge is a showcase-ready LangGraph planning agent that turns rough ideas into execution briefs."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6.0,<2",
    "langchain-core>=1.3.3",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-dir]
"agent" = "src/agent"
